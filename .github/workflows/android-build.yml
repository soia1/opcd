name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch PRoot native binary
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fsSL "https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-aarch64-static" \
            -o app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so
          ls -l app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opcd-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
