plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opcd.android'
    compileSdk 34
    // Pinned to match the version installed in CI by
    // .github/workflows/android-build.yml (android-actions/setup-android@v3
    // with ndk-version: 25.2.9519653).
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "com.opcd.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // Extract native libraries (libproot.so, libopcd-exec.so) to
            // /data/app/<pkg>/lib/<abi>/ as real, executable files. Required
            // so PRoot can be execve()'d from the native library directory
            // (the only app-owned storage Android 10+ SELinux allows
            // execution from).
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.preference:preference:1.2.1'
}
